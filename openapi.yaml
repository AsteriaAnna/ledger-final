      summary: 处理无来源手动账单核对项
      description: '使用环节：用户保留或删除核对账单。

        成功/副作用：比较核对项自己的version；keep仅设kept_manual；delete通过M3撤销本人手动交易并关闭核对项，返回资金/月份变化。

        异常/边界：核对项/交易/profile/batch关联与归属全验证；已匹配来源的项目不能再删除；删除不安全409且核对状态不改；同意图重复不二次删账，不拿全batch版本挡其他项。'
      parameters:
      - name: batchId
        in: path
        required: true
        schema: *id001
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 已完成该操作。
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ReviewResult'
                required:
                - data
                additionalProperties: false
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
