openapi: 3.1.0
info:
  title: 星账 V1 公开API契约
  version: 1.0.0
  description: '设计契约，未部署。24个公开操作覆盖M1–M5；认证签发/刷新/退出由外部认证服务承担。原生单库事务/必要POST幂等/资源级版本比较作为选定边界；不引入Redis/MQ/分布式锁。

    导入Evidence返回canonical_method_keys；Candidate按单账户或转账两端分别返回规范渠道键，客户端原样提交映射，不重复解析名称。ImportBatch.source_metadata保存本人可读的原始头元数据。'
servers:
- url: /api/v1
  description: 相对业务前缀，不代表生产地址
security:
- bearerAuth: []
tags:
- name: M1
- name: M2
- name: M3
- name: M4
- name: M5
paths:
  /relationship:
    get:
      operationId: getRelationship
      tags:
      - M1
      summary: 查询绑定状态
      description: '使用环节：登录后进入我的/决定对象查看入口。

        成功/副作用：只返回本人当前关系与必要对象信息；不创建邀请或关系。

        异常/边界：未绑定partner=null、权限none；不返回邀请凭据。'
      parameters: []
      responses:
        '200':
          description: 只读结果；无业务数据库修改。
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Relationship'
                required:
                - data
                additionalProperties: false
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
  /relationship/invitations:
    post:
      operationId: createBindingInvitation
      tags:
      - M1
      summary: 生成绑定凭据
      description: '使用环节：未绑定用户发起关系绑定。

        成功/副作用：创建本人10分钟有效、一次性邀请；新意图使本人旧的未消费邀请失效；发起邀请表达绑定意愿。

        异常/边界：已绑定409 RELATIONSHIP_CONFLICT；旧键只重放原token及原到期时间，不延期；凭据只经本人主动复制交给对方，不自动发送。'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: 已完成该操作。
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/BindingInvitation'
                required:
                - data
                additionalProperties: false
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: {}
              required: []
              additionalProperties: false
            example: {}
  /relationship/binding:
    post:
      operationId: bindRelationship
      tags:
      - M1
      summary: 确认并完成绑定
      description: '使用环节：接收方输入对方凭据并确认。

        成功/副作用：验证双方均未绑定、凭据非本人且有效，一次消费凭据并建立关系；不改变钱归属或历史账务。

        异常/边界：过期/无效/本人凭据422 BINDING_INVITATION_INVALID；与其他人已绑定409；同一双方已成功的重试返回当前绑定，不再创建第二关系。'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 已完成该操作。
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Relationship'
                required:
                - data
                additionalProperties: false
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BindRequest'
            example:
              binding_token: opaque-invitation
  /accounts:
    get:
      operationId: listAccounts
      tags:
      - M2
      summary: 查询账户列表
      description: '使用环节：账户页、记账选账户、导入映射。

        成功/副作用：只读当前余额/份额与初始状态；对象账户read_only=true。

        异常/边界：空列表data=[]；不可用partner视图403；游标与本人/对象范围绑定。'
      parameters:
      - &id002
        $ref: '#/components/parameters/View'
      - &id003
        $ref: '#/components/parameters/Limit'
      - &id004
        $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 只读结果；无业务数据库修改。
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Account'
                  page:
                    type: object
                    properties:
                      next_cursor:
                        anyOf:
                        - &id006
                          type: string
                        - type: 'null'
                    required:
                    - next_cursor
                    additionalProperties: false
                required:
                - data
                - page
                additionalProperties: false
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
    post:
      operationId: createAccount
      tags:
      - M2
      summary: 创建实际账户
      description: '使用环节：首次使用或新增银行卡/钱包。

        成功/副作用：创建本人账户与初始分配，金额合计一致，不计收入；缺省custodian=self。

        异常/边界：起始日未来/份额重复/合计不等422；partner份额仅绑定后savings；账户名称不作为去重键。'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: 已完成该操作。
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Account'
                required:
                - data
                additionalProperties: false
          headers:
            ETag:
              description: 目标资源当前强ETag。
              schema:
                type: string
                pattern: ^"[1-9][0-9]*"$
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCreate'
            example:
              name: 钱包
              account_type: wechat_balance
              opening_state:
                opening_date: '2026-08-01'
                opening_balance_minor: 500000
                opening_allocations:
                - fund_owner: self
                  fund_type: liquid
                  amount_minor: 500000
  /accounts/{accountId}:
    get:
      operationId: getAccount
      tags:
      - M2
      summary: 查询单个账户
      description: '使用环节：查看账户或打开编辑表单。

        成功/副作用：返回当前计算份额和完整opening_state，供现有编辑表单使用。

        异常/边界：不存在/不可见404；对象可读不可写，不反向赋予资金所有人写权限。'
      parameters:
      - name: accountId
        in: path
        required: true
        schema: &id001
          type: string
          minLength: 1
      responses:
        '200':
          description: 只读结果；无业务数据库修改。
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Account'
                required:
                - data
                additionalProperties: false
          headers:
            ETag:
              description: 目标资源当前强ETag。
              schema:
                type: string
                pattern: ^"[1-9][0-9]*"$
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
    patch:
      operationId: patchAccount
      tags:
      - M2
      summary: 编辑账户基本信息
      description: '使用环节：账户页改名或保管关系。

        成功/副作用：只更新name/account_type/custodian，合法无变化保持version。

        异常/边界：禁止余额、holder、fund_shares、opening_state字段；不能把已映射钱包改成不兼容类型；未绑定不能custodian=partner；过期412。'
      parameters:
      - name: accountId
        in: path
        required: true
        schema: *id001
      - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: 已完成该操作。
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Account'
                required:
                - data
                additionalProperties: false
          headers:
            ETag:
              description: 目标资源当前强ETag。
              schema:
                type: string
                pattern: ^"[1-9][0-9]*"$
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '412':
          $ref: '#/components/responses/Error412'
        '422':
          $ref: '#/components/responses/Error422'
        '428':
          $ref: '#/components/responses/Error428'
        '500':
          $ref: '#/components/responses/Error500'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountPatch'
            example:
              name: 我的钱包
  /accounts/{accountId}/opening-state:
    put:
      operationId: putOpeningState
      tags:
      - M2
      summary: 修正初始状态
      description: '使用环节：发现初始金额或日期填错。

        成功/副作用：整体替换初始状态、重建本账户受影响资金与历史/有效状态，其他账户和交易事实不改。

        异常/边界：不能安全重建409 OPENING_STATE_RECALCULATION_CONFLICT并全部不生效；空改动version不变，不提供直接覆盖当前余额。'
      parameters:
      - name: accountId
        in: path
        required: true
        schema: *id001
      - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: 已完成该操作。
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Account'
                required:
                - data
                additionalProperties: false
          headers:
            ETag:
              description: 目标资源当前强ETag。
              schema:
                type: string
                pattern: ^"[1-9][0-9]*"$
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '412':
          $ref: '#/components/responses/Error412'
        '422':
          $ref: '#/components/responses/Error422'
        '428':
          $ref: '#/components/responses/Error428'
        '500':
          $ref: '#/components/responses/Error500'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpeningState'
            example:
              opening_date: '2026-08-01'
              opening_balance_minor: 500000
              opening_allocations:
              - fund_owner: self
                fund_type: liquid
                amount_minor: 500000
  /accounts/{accountId}/fund-adjustments:
    post:
      operationId: adjustFunds
      tags:
      - M2
      summary: 调整账户内资金份额
      description: '使用环节：把存款转流动或调整资金归属。

        成功/副作用：同账户等额调整当前份额和存款基准，余额不变，不记消费/收入；账户version递增。

        异常/边界：from=to/非法份额422；来源不足409；对象账户不可写，不能把对象流动分配到本人账户。'
      parameters:
      - name: accountId
        in: path
        required: true
        schema: *id001
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: 已完成该操作。
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Account'
                required:
                - data
                additionalProperties: false
          headers:
            ETag:
              description: 目标资源当前强ETag。
              schema:
                type: string
                pattern: ^"[1-9][0-9]*"$
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '412':
          $ref: '#/components/responses/Error412'
        '422':
          $ref: '#/components/responses/Error422'
        '428':
          $ref: '#/components/responses/Error428'
        '500':
          $ref: '#/components/responses/Error500'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FundAdjustment'
            example:
              from:
                fund_owner: self
                fund_type: liquid
              to:
                fund_owner: self
                fund_type: savings
              amount_minor: 10000
  /transactions:
    get:
      operationId: listTransactions
      tags:
      - M3
      summary: 查询账单列表
      description: '使用环节：账单页筛选/搜索或确认超时结果。

        成功/副作用：只读保存事实，含historical_only账单；不标已核对、不写账。

        异常/边界：from/to北京时间包含边界且from<=to；空列表[]；分页按occurred_at倒序与id确定次序；对象不返回来源证据数组。'
      parameters:
      - *id002
      - *id003
      - *id004
      - name: from
        in: query
        required: false
        schema: &id005
          type: string
          format: date
      - name: to
        in: query
        required: false
        schema: *id005
      - name: type
        in: query
        required: false
        schema:
          type: string
          enum:
          - income
          - expense
          - transfer
          - refund
      - name: account_id
        in: query
        required: false
        schema: *id001
      - name: category_code
        in: query
        required: false
        schema: &id029
          type: string
          enum: &id015
          - food
          - shopping
          - transport
          - education
          - health
          - entertainment
          - utilities
          - other
      - name: q
        in: query
        required: false
        schema: *id006
      responses:
        '200':
          description: 只读结果；无业务数据库修改。
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Transaction'
                  page:
                    type: object
                    properties:
                      next_cursor:
                        anyOf:
                        - *id006
                        - type: 'null'
                    required:
                    - next_cursor
                    additionalProperties: false
                required:
                - data
                - page
                additionalProperties: false
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
    post:
      operationId: createTransaction
      tags:
      - M3
      summary: 手动创建交易
      description: '使用环节：手动记账提交。

        成功/副作用：统一M3创建income/expense/无费transfer；semantics按type派生，不让客户端选；有效端改变资金，历史端只保存事实；后续查询按新交易计算相关月份统计。

        异常/边界：禁止refund和客户端accounting_semantics/user_id/余额/源证据；未来时间/同账户转账422；金额/份额不足整笔409；转账两端无单边成功；不同键代表新意图。'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: 已完成该操作。
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Mutation'
                required:
                - data
                additionalProperties: false
          headers:
            ETag:
              description: 目标资源当前强ETag。
              schema:
                type: string
                pattern: ^"[1-9][0-9]*"$
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualCreate'
            example:
              type: expense
              account_id: account-a
              amount_minor: 2580
              occurred_at: '2026-10-20T12:30:00+08:00'
              category_code: other
              merchant: 午餐
              note: ''
  /transactions/{transactionId}:
    get:
      operationId: getTransaction
      tags:
      - M3
      summary: 查询单笔账单
      description: '使用环节：详情、编辑前读取或确认编辑结果。

        成功/副作用：返回当前事实/版本及本人允许的来源摘要；不恢复已删除交易。

        异常/边界：删除后404；对象read_only=true、source_summaries=[]。'
      parameters:
      - name: transactionId
        in: path
        required: true
        schema: *id001
      responses:
        '200':
          description: 只读结果；无业务数据库修改。
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Transaction'
                required:
                - data
                additionalProperties: false
          headers:
            ETag:
              description: 目标资源当前强ETag。
              schema:
                type: string
                pattern: ^"[1-9][0-9]*"$
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
    patch:
      operationId: patchTransaction
      tags:
      - M3
      summary: 编辑已有账单含退款
      description: '使用环节：账单页编辑保存。

        成功/副作用：省略字段保持；普通类型可在income/expense/transfer间变，refund保持类型/子类型；仅抵减不动资金，仅日期不跨起始日保留份额计划；返回受影响月份。

        异常/边界：空对象/相同值不增版本但仍比较If-Match；null仅允许清空手动声明source_account_profile_id，其他字段不接受null；refund不能改type/子类型/源时间；普通交易不能改refund；撤销不安全409并保留全部原值；跨起始日会改变有效余额；不重算后续全部份额。'
      parameters:
      - name: transactionId
        in: path
        required: true
        schema: *id001
      - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: 已完成该操作。
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Mutation'
                required:
                - data
                additionalProperties: false
          headers:
            ETag:
              description: 目标资源当前强ETag。
              schema:
                type: string
                pattern: ^"[1-9][0-9]*"$
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '412':
          $ref: '#/components/responses/Error412'
        '422':
          $ref: '#/components/responses/Error422'
        '428':
          $ref: '#/components/responses/Error428'
        '500':
          $ref: '#/components/responses/Error500'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionPatch'
            example:
              occurred_at: '2026-08-15T12:00:00+08:00'
              affects_spending: false
    delete:
      operationId: deleteTransaction
      tags:
      - M3
      summary: 删除当前账单
      description: '使用环节：账单详情删除。

        成功/副作用：仅撤销本交易，解除其来源当前关联但保留观察；消费不级联独立退款。

        异常/边界：不能安全撤销409，全部不删；不存在/已删除404；再次DELETE不会重复扣改资金；恢复由新导入操作完成，不建回收站。'
      parameters:
      - name: transactionId
        in: path
        required: true
        schema: *id001
      - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: 已完成该操作。
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/DeleteResult'
                required:
                - data
                additionalProperties: false
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '412':
          $ref: '#/components/responses/Error412'
        '422':
          $ref: '#/components/responses/Error422'
        '428':
          $ref: '#/components/responses/Error428'
        '500':
          $ref: '#/components/responses/Error500'
  /transaction-categories:
    get:
      operationId: listCategories
      tags:
