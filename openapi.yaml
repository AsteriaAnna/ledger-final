      summary: 查询档案渠道映射
      description: '使用环节：导入需要选择实际账户。

        成功/副作用：只读本人profile已有映射。

        异常/边界：无映射[]；无profile/他人profile422或404；钱包不得跨账号串用，银行卡可确认复用。'
      parameters:
      - name: source_account_profile_id
        in: query
        required: true
        schema: *id001
      responses:
        '200':
          description: 只读结果；无业务数据库修改。
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Mapping'
                required:
                - data
                additionalProperties: false
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
    put:
      operationId: putMapping
      tags:
      - M4
      summary: 保存渠道到实际账户映射
      description: '使用环节：用户选择一次渠道实际账户。

        成功/副作用：expected_version=0表示新建，否则比较本映射版本；只更新映射，不直接改变既有交易或开始入账；客户端随后自动调用resume，不再逐行确认。

        异常/边界：同profile/key唯一；新建已存在或更新版本冲突409；钱包跨档案冲突422；目标必须本人可写；重复相同值不增版本。'
      parameters: []
      responses:
        '200':
          description: 已完成该操作。
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Mapping'
                required:
                - data
                additionalProperties: false
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MappingPut'
            example:
              source_account_profile_id: profile-a
              canonical_method_key: 微信零钱
              account_id: account-a
              expected_version: 0
  /imports/{batchId}/reconciliation-reviews:
