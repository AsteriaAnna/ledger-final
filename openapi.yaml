              reconciliation_item_id: review-a
              expected_version: 1
              action: keep_manual
  /overview:
    get:
      operationId: getOverview
      tags:
      - M5
      summary: 查询首页总览
      description: '使用环节：登录后首页/切换历史月份。

        成功/副作用：资金为当前可见四类份额，消费/预算是指定月本人数据；未绑定对象两份额null。

        异常/边界：未来统计月422；无预算budget=null；净花销可负；上月日均0时变化率null；金额显示到分、中间不提前舍入；不修改预算/交易。'
      parameters:
      - name: month
        in: query
        required: true
        schema: &id007
          type: string
          pattern: ^\d{4}-(0[1-9]|1[0-2])$
      responses:
        '200':
          description: 只读结果；无业务数据库修改。
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Overview'
                required:
                - data
                additionalProperties: false
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
  /budgets/{month}:
    get:
      operationId: getBudget
