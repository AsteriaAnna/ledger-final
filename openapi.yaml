          application/json:
            schema:
              $ref: '#/components/schemas/BudgetPut'
            example:
              budget_minor: 300000
              expected_version: 0
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 已验证凭据；签发供应商由部署选型确定，非默认为JWT。
  parameters:
    View:
      name: view
      in: query
      required: false
      schema:
        type: string
        enum:
        - mine
        - partner
        default: mine
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      schema: *id006
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 本人+方法+路径作用域；24小时内同键同规范化请求重放原结果；同键不同请求409；进行中409 REQUEST_IN_PROGRESS。过期不保证避免重复。
      schema:
        type: string
        minLength: 1
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: 目标资源的当前强ETag，例如"3"；缺失428、过期412；幂等重放先于版本比较。
      schema:
        type: string
        pattern: ^"[1-9][0-9]*"$
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
          enum:
          - BAD_REQUEST
          - UNAUTHENTICATED
          - FORBIDDEN
          - RESOURCE_NOT_FOUND
          - RESOURCE_VERSION_CONFLICT
          - PRECONDITION_REQUIRED
          - IDEMPOTENCY_KEY_CONFLICT
          - REQUEST_IN_PROGRESS
          - FUNDS_ALLOCATION_NOT_POSSIBLE
          - OPENING_STATE_RECALCULATION_CONFLICT
          - VALIDATION_ERROR
          - REFUND_REQUIRES_OFFICIAL_SOURCE
          - UNSUPPORTED_SOURCE_FILE
          - BINDING_INVITATION_INVALID
          - RELATIONSHIP_CONFLICT
          - SOURCE_OBSERVATION_STALE
          - SOURCE_STATE_CONFLICT
          - PAYLOAD_TOO_LARGE
          - INTERNAL_ERROR
        message: *id006
      required:
      - code
      - message
      additionalProperties: false
    ShareRef:
      oneOf:
      - type: object
        properties:
          fund_owner:
            const: self
          fund_type:
            const: liquid
        required:
        - fund_owner
        - fund_type
        additionalProperties: false
      - type: object
        properties:
          fund_owner:
            const: self
          fund_type:
            const: savings
        required:
        - fund_owner
        - fund_type
        additionalProperties: false
      - type: object
        properties:
          fund_owner:
            const: partner
          fund_type:
            const: savings
        required:
        - fund_owner
        - fund_type
        additionalProperties: false
    WriteAllocation:
      oneOf:
      - type: object
        properties:
          fund_owner:
            const: self
          fund_type:
            const: liquid
          amount_minor: &id008
            type: integer
            minimum: 0
        required:
        - fund_owner
        - fund_type
        - amount_minor
        additionalProperties: false
      - type: object
        properties:
          fund_owner:
            const: self
          fund_type:
            const: savings
          amount_minor: *id008
        required:
        - fund_owner
        - fund_type
        - amount_minor
        additionalProperties: false
      - type: object
        properties:
          fund_owner:
            const: partner
          fund_type:
            const: savings
          amount_minor: *id008
        required:
        - fund_owner
        - fund_type
        - amount_minor
        additionalProperties: false
    FundShare:
      type: object
      properties:
        fund_owner:
          type: string
          enum:
          - self
          - partner
        fund_type:
          type: string
          enum:
          - liquid
          - savings
        amount_minor: *id008
        savings_baseline_minor:
          anyOf:
          - *id008
          - type: 'null'
        savings_gap_minor:
          anyOf:
          - *id008
          - type: 'null'
      required:
      - fund_owner
      - fund_type
      - amount_minor
      - savings_baseline_minor
      - savings_gap_minor
      additionalProperties: false
    OpeningState:
      type: object
      properties:
        opening_date: *id005
        opening_balance_minor: *id008
        opening_allocations:
          type: array
          items:
            $ref: '#/components/schemas/WriteAllocation'
          minItems: 1
          maxItems: 3
      required:
      - opening_date
      - opening_balance_minor
      - opening_allocations
      additionalProperties: false
    AccountCreate:
      type: object
      properties:
        name: &id009
          type: string
          minLength: 1
          maxLength: 80
        account_type:
          type: string
          enum:
          - cash
          - bank_card
          - wechat_balance
          - alipay_balance
          - other
        custodian:
          type: string
          enum:
          - self
          - partner
          default: self
        opening_state:
          $ref: '#/components/schemas/OpeningState'
      required:
      - name
      - account_type
      - opening_state
      additionalProperties: false
    AccountPatch:
      type: object
      properties:
        name: *id009
        account_type:
          type: string
          enum:
          - cash
          - bank_card
          - wechat_balance
          - alipay_balance
          - other
        custodian:
          type: string
          enum:
          - self
          - partner
      required: []
      additionalProperties: false
    Account:
      type: object
      properties:
        id: *id001
        name: *id009
        account_type:
          type: string
          enum:
          - cash
          - bank_card
          - wechat_balance
          - alipay_balance
          - other
        holder:
          type: string
