      summary: 查询受控分类字典
      description: '使用环节：手动记账/编辑分类选择。

        成功/副作用：只读字典；other兜底，分类不决定资金方向。

        异常/边界：不提供用户分类管理接口，不调用AI。'
      parameters: []
      responses:
        '200':
          description: 只读结果；无业务数据库修改。
