        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
  /imports:
    post:
      operationId: uploadImport
      tags:
      - M4
      summary: 导入官方XLSX
      description: '使用环节：选择官方账单文件。

        成功/副作用：创建本人batch与观察，自动解析/规范化；档案明确时处理可入账行，逐行调用统一M3；不支持和待处理行不写账；同步返回当前分页结果与全批汇总。

        异常/边界：仅XLSX，文件<=10MiB且明细<=10000行；无法判型/读取422，超额413且不写账；可读但声明数不符仍展示行、禁止缺失核对；无档案也返回batch及候选。部分行失败不回滚已完成其他行；同键重试重放原批次，新键重导重检当前来源关联；不虚构202后台任务。'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: 已完成该操作。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '413':
          $ref: '#/components/responses/Error413'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                source_account_profile_id: *id001
              required:
              - file
              additionalProperties: false
  /imports/{batchId}:
    get:
      operationId: getImport
      tags:
      - M4
      summary: 查询导入结果与恢复选项
      description: '使用环节：导入后查看/刷新阶段内容。

        成功/副作用：只读阶段、证据、规范化候选、结果/原因、允许动作；不因刷新而继续入账。

        异常/边界：只读本人批次；两个游标独立，summary始终全批；unsupported/ineffective是已说明终态，不等于created。'
      parameters:
      - $ref: '#/components/parameters/Limit'
      - name: rows_cursor
        in: query
        required: false
        schema: *id006
      - name: reconciliation_cursor
        in: query
        required: false
        schema: *id006
      - name: batchId
        in: path
        required: true
        schema: *id001
      responses:
        '200':
          description: 只读结果；无业务数据库修改。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResponse'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
  /imports/{batchId}/resolutions:
    post:
      operationId: resolveImport
      tags:
      - M4
      summary: 确认解释并继续导入
      description: '使用环节：档案选择、批次继续、角色确认或同事件确认。

        成功/副作用：select_source_profile固定档案并处理就绪行；resume批次继续，不要求逐行点创建；set_transfer_role保存合法角色并继续本行；create_transaction明确确认新事件后继续本行；link只关联同一事件；accept_source_change只确认来源变化、不改已存交易。

        异常/边界：档案动作比较profile_version；行决策比较expected_source_version，不锁整个batch；resume用最新就绪来源且每行防重复。旧观察不可覆盖新事实；unsupported/ineffective/failed不可create/link；无有效交易且条件齐备可创建独立refund，禁止手动伪造来源。参数/权限错误整个请求无修改；执行阶段账务失败按行报告，证据/解释可已保存。'
      parameters:
      - name: batchId
        in: path
        required: true
        schema: *id001
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 已完成该操作。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Resolution'
            example:
              action: resume
  /source-payment-method-mappings:
    get:
      operationId: listMappings
      tags:
