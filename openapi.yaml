    ReviewResult:
      type: object
      properties:
        reconciliation_item_id: *id001
        status:
          type: string
          enum:
          - kept_manual
          - deleted
        transaction_id: *id001
        account_changes:
          type: array
          items:
            $ref: '#/components/schemas/AccountBalance'
        affected_months:
          type: array
          items: *id007
        version:
          anyOf:
          - *id010
          - type: 'null'
      required:
      - reconciliation_item_id
      - status
      - transaction_id
      - account_changes
      - affected_months
      - version
      additionalProperties: false
    Budget:
      type: object
      properties:
        month: *id007
        budget_minor: *id008
        version: *id010
      required:
      - month
      - budget_minor
      - version
      additionalProperties: false
    BudgetPut:
      type: object
      properties:
        budget_minor: *id008
        expected_version: *id008
      required:
      - budget_minor
      - expected_version
      additionalProperties: false
    Overview:
      type: object
      properties:
        month: *id007
        as_of_date: *id005
        relationship_status:
          type: string
          enum:
          - unbound
          - bound
        funds:
          type: object
          properties:
            my_liquid_minor: *id008
            my_savings_minor: *id008
            partner_liquid_minor:
              anyOf:
              - *id008
              - type: 'null'
            partner_savings_minor:
              anyOf:
              - *id008
              - type: 'null'
            visible_total_minor: *id008
          required:
          - my_liquid_minor
          - my_savings_minor
          - partner_liquid_minor
          - partner_savings_minor
          - visible_total_minor
          additionalProperties: false
        personal_spending:
          type: object
          properties:
            expense_minor: *id008
            refund_offset_minor: *id008
            month_spent_minor: *id031
            daily_average_minor: *id031
            previous_month_daily_average_minor: *id031
            daily_change_minor: *id031
            daily_change_rate:
              anyOf:
              - type: number
              - type: 'null'
            projected_month_spending_minor: *id031
          required:
          - expense_minor
          - refund_offset_minor
          - month_spent_minor
          - daily_average_minor
          - previous_month_daily_average_minor
          - daily_change_minor
          - daily_change_rate
          - projected_month_spending_minor
          additionalProperties: false
        budget:
          anyOf:
          - type: object
            properties:
              budget_minor: *id008
              spent_minor: *id031
              remaining_minor: *id008
              over_budget_minor: *id008
              status:
                type: string
                enum:
                - within_budget
                - over_budget
            required:
            - budget_minor
            - spent_minor
            - remaining_minor
            - over_budget_minor
            - status
            additionalProperties: false
          - type: 'null'
      required:
      - month
      - as_of_date
      - relationship_status
      - funds
      - personal_spending
      - budget
      additionalProperties: false
    ImportResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/ImportBatch'
        page:
          type: object
          properties:
            rows_next_cursor:
              anyOf:
              - *id006
              - type: 'null'
            reconciliation_next_cursor:
              anyOf:
              - *id006
              - type: 'null'
          required:
          - rows_next_cursor
          - reconciliation_next_cursor
          additionalProperties: false
      required:
      - data
      - page
      additionalProperties: false
  responses:
    Error401:
      description: 登录凭据无效。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: UNAUTHENTICATED
            message: 登录凭据无效。
    Error403:
      description: 当前资源只读，不能修改。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: FORBIDDEN
            message: 当前资源只读，不能修改。
    Error404:
      description: 资源不存在或不可访问。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: RESOURCE_NOT_FOUND
            message: 资源不存在或不可访问。
    Error422:
      description: 请求字段或业务条件不合法。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: VALIDATION_ERROR
            message: 请求字段或业务条件不合法。
    Error500:
      description: 本次操作未能完成。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: INTERNAL_ERROR
            message: 本次操作未能完成。
    Error400:
      description: 请求结构无法解析。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: BAD_REQUEST
            message: 请求结构无法解析。
    Error409:
      description: 当前业务状态不允许该操作。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: SOURCE_STATE_CONFLICT
            message: 当前业务状态不允许该操作。
    Error412:
      description: 资源已被修改，请刷新。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: RESOURCE_VERSION_CONFLICT
            message: 资源已被修改，请刷新。
    Error428:
      description: 请携带当前资源版本。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: PRECONDITION_REQUIRED
            message: 请携带当前资源版本。
    Error413:
      description: 文件超出支持范围。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: PAYLOAD_TOO_LARGE
            message: 文件超出支持范围。
