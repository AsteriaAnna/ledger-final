      description: '使用环节：预算表单读取/未来预算查看。

        成功/副作用：只读本人预算，未设置data=null。

        异常/边界：合法未来月份允许；不返回对象预算写入口。'
      parameters:
      - name: month
        in: path
        required: true
        schema: *id007
      responses:
        '200':
          description: 只读结果；无业务数据库修改。
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    anyOf:
                    - $ref: '#/components/schemas/Budget'
                    - type: 'null'
                required:
                - data
                additionalProperties: false
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
    put:
      operationId: putBudget
      tags:
      - M5
      summary: 设置个人月预算
      description: '使用环节：首页/预算表单保存。

        成功/副作用：0版本创建，否则比较本人该月预算version并整体替换；不产生资金变动，overview随后使用新预算。

        异常/边界：金额非负整数；存在/版本冲突409，非法月份422；相同值不增版本；不能指定他人user_id。'
      parameters:
      - name: month
        in: path
        required: true
        schema: *id007
      responses:
        '200':
