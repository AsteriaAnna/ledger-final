name: 缺陷
description: 报告一个可复现的问题
title: "bug: "
labels: ["type: bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: 问题现象
      description: 发生了什么？期望是什么？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 ...
        2. 点击 ...
        3. 看到 ...
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 环境
      description: 系统 / 浏览器 / 版本号
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: 截图 / 日志
    validations:
      required: false
