name: 需求 / 功能
description: 提出一个新的功能或改进
title: "feat: "
labels: ["type: feature"]
body:
  - type: textarea
    id: background
    attributes:
      label: 背景与问题
      description: 现在遇到什么问题？为什么需要这个功能？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你希望它怎么工作？可以描述交互或规则。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 满足哪些条件就算完成？（建议用可勾选清单）
      placeholder: |
        - [ ] 条件一
        - [ ] 条件二
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / 补充信息
      description: 可选。截图、参考产品、边界情况等。
    validations:
      required: false
